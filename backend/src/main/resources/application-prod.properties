# ============================
# Production Profile (Render.com + Neon PostgreSQL)
# ============================
# Activate via environment variable: SPRING_PROFILES_ACTIVE=prod

# Neon PostgreSQL — set DATABASE_URL in Render environment variables
# Format: jdbc:postgresql://ep-xxx.neon.tech:5432/neondb?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

# File uploads — Render ephemeral disk (or swap to Cloudinary later)
app.upload.dir=/tmp/uploads

# CORS — allow your Vercel frontend URL
app.cors.allowed-origins=${FRONTEND_URL:https://your-app.vercel.app}

# Logging
logging.level.com.portfolio=INFO
